const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const say=t=>{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.8;speechSynthesis.speak(u)};

/* ---- Spaced repetition (SM-2 semplificato, 4 gradi) ---- */
const DAY=86400000;
const SR={again:0,hard:1,good:2,easy:3};
const DEFAULT_SR=()=>({seen:0,right:0,wrong:0,streak:0,due:0,ivl:0,ease:2.5,reps:0,lapses:0});

const g=id=>{
  const p=DB.prog[id]||{};
  if(p.due===undefined){
    p.due=0;p.ivl=0;p.ease=2.5;p.reps=0;p.lapses=0;
    if(p.seen && !(p.wrong>0 && p.streak<2)) p.due=Date.now()+DAY;
    DB.prog[id]=p;
  }
  return p;
};
const isDue=p=>p.seen && p.due<=Date.now();

function schedule(p,grade){
  p.reps=p.reps||0; p.ease=p.ease||2.5; p.ivl=p.ivl||0;
  if(grade===SR.again){
    p.lapses=(p.lapses||0)+1;
    p.reps=0;
    p.ivl=0;
    p.ease=Math.max(1.3,p.ease-0.2);
    p.wrong=(p.wrong||0)+1; p.streak=0;
    p.due=Date.now();
  }else{
    p.right=(p.right||0)+1; p.streak=(p.streak||0)+1;
    if(p.ivl===0){
      p.ivl=1;
    }else{
      const mult = grade===SR.hard?1.2 : grade===SR.easy?1.3*p.ease : p.ease;
      p.ivl=Math.max(1,Math.round(p.ivl*mult));
    }
    if(grade===SR.easy) p.ease+=0.15;
    if(grade===SR.hard) p.ease=Math.max(1.3,p.ease-0.15);
    p.ease=Math.min(3.0,p.ease);
    p.reps++;
    p.due=Date.now()+p.ivl*DAY;
  }
  p.seen=1;
  return p;
}

function ivlLabel(h,grade){
  const p=Object.assign(DEFAULT_SR(),DB.prog[h]);
  const copy={...p};
  schedule(copy,grade);
  if(copy.ivl===0) return "adesso";
  if(copy.ivl===1) return "1 g";
  if(copy.ivl<30)  return copy.ivl+" g";
  return Math.round(copy.ivl/30)+" mesi";
}

function nextDueLabel(p){
  if(!p.seen) return "<em>nuova</em>";
  if(p.due<=Date.now()) return '<em class="ko">da ripassare</em>';
  const d=Math.ceil((p.due-Date.now())/DAY);
  return `<em>tra ${d} g</em>`;
}

function dueCount(){return act().filter(w=>isDue(g(w.h))).length}

/* ---- Stato UI ---- */
let tab="learn",Q=[],i=0,shown=false,mode="hz",score=0,qv="",flt="all",editing=null;

function go(t,m){
  tab=t;Q=[];i=0;shown=false;score=0;editing=null;
  if(t==="learn"){
    mode="hz";
    Q=shuffle(act().filter(w=>!g(w.h).seen)).slice(0,10);
  }else if(t==="review"){
    mode="hz";
    Q=shuffle(act().filter(w=>isDue(g(w.h))));
  }else if(t==="play"&&m){
    mode=m;Q=shuffle(act()).slice(0,10);
  }
  render();
}

function stat(){
  const a=act(),seen=a.filter(w=>g(w.h).seen).length,due=dueCount();
  $("#stat").innerHTML=`${seen} viste · ${a.length-seen} nuove`+
    (due?`<br><b style="color:var(--acc)">${due} da ripassare</b>`:"");
  const rb=document.querySelector('nav button[data-tab="review"]');
  if(rb) rb.innerHTML=`Ripasso`+(due?` <span class="badge">${due}</span>`:"");
}

function render(){
  document.querySelectorAll("nav button").forEach(b=>{
    const on=b.dataset.tab===tab;
    b.classList.toggle("on",on);
    if(b.dataset.tab==="review" && !on){
      // il badge resta anche quando non è attivo
      const n=dueCount();
      b.innerHTML="Ripasso"+(n?` <span class="badge">${n}</span>`:"");
    }
  });
  stat();
  if(tab==="list")return list();
  if(tab==="play"&&!Q.length)return playMenu();
  session();
}

function noActive(){return `<p class="empty">Nessuna parola attiva. Accendi quelle che conosci nell'Elenco.</p>`}

function playMenu(){
  if(!act().length){app.innerHTML=noActive();return}
  app.innerHTML=`<div class="menu">
  <button class="btn" data-m="hz">Cinese → italiano<small>Leggi il carattere e ricorda il significato</small></button>
  <button class="btn" data-m="it">Italiano → cinese<small>Vedi il significato e ricorda il carattere</small></button>
  <button class="btn" data-m="audio">Solo audio<small>Ascolta e riconosci la parola</small></button></div>`;
}

function session(){
  if(!act().length){app.innerHTML=noActive();return}
  if(!Q.length){
    app.innerHTML=`<p class="empty">${
      tab==="learn"
        ?"Nessuna parola nuova: hai già visto tutte quelle attive."
        :"Nessuna parola in scadenza. Torna più tardi, oppure accendi nuove parole nell'Elenco."
    }</p>`;
    return;
  }
  const w=Q[i];
  if(!w){
    app.innerHTML=`<div class="done"><p class="big">${score} / ${Q.length}</p><p>indovinate</p>
      <button class="btn pri" data-act="again">Ancora</button></div>`;
    return;
  }
  const bar=Q.map((_,k)=>`<i class="${k<i?"d":k===i?"c":""}"></i>`).join("");
  const cell=(mode==="hz"||shown)
    ?`<div class="cell"><span class="hz">${esc(w.h)}</span></div>`
    :mode==="audio"
      ?`<button class="cell spk" data-act="say" aria-label="Riascolta">♪</button>`
      :"";
  const mean=(mode==="it"||shown)?`<div class="mean${shown?"":" big"}">${esc(w.m)}</div>`:"";
  const rows=[["Componenti",w.c],["Tratti",w.t],["Trucco",w.k]]
    .filter(r=>r[1]!==""&&r[1]!=null)
    .map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("");
  const back=shown?`<div class="py">${esc(w.p)}</div>${rows?`<dl>${rows}</dl>`:""}`:"";
  const btns=shown
    ?`<div class="row sr-btns">
        <button class="btn ic" data-act="say" aria-label="Ascolta">♪</button>
        <button class="btn sr-again" data-grade="again">Ancora<small>${ivlLabel(w.h,SR.again)}</small></button>
        <button class="btn sr-hard"  data-grade="hard">Difficile<small>${ivlLabel(w.h,SR.hard)}</small></button>
        <button class="btn sr-good"  data-grade="good">Bene<small>${ivlLabel(w.h,SR.good)}</small></button>
        <button class="btn sr-easy"  data-grade="easy">Facile<small>${ivlLabel(w.h,SR.easy)}</small></button>
      </div>`
    :`<div class="row"><button class="btn ic" data-act="say" aria-label="Ascolta">♪</button><button class="btn pri" data-act="show">Scopri</button></div>`;
  app.innerHTML=`<div class="bar">${bar}</div>${cell}${mean}${back}${btns}
    <p class="hint">spazio scopri · 1 ancora · 2 difficile · 3 bene · 4 facile · A ascolta</p>`;
  if(mode==="audio"&&!shown)setTimeout(()=>say(w.h),150);
}

function answer(grade){
  const w=Q[i];if(!w)return;
  const p=DB.prog[w.h]=Object.assign(DEFAULT_SR(),DB.prog[w.h]);
  schedule(p,grade);
  if(grade!==SR.again) score++;
  save();
  // le "Ancora" rientrano in coda 3–5 carte dopo (stessa sessione)
  if(grade===SR.again && Q.length<200){
    const pos=Math.min(Q.length,i+3+Math.floor(Math.random()*3));
    Q.splice(pos,0,w);
  }
  i++;shown=false;render();
}

function row(w,k){
  const p=g(w.h);
  const st=p.seen
    ?`<em>${p.right||0} ok</em> · ${nextDueLabel(p)}`
    :"<em>nuova</em>";
  return `<div class="item${w.on?"":" off"}"><input type="checkbox" class="sw" data-tog="${k}" ${w.on?"checked":""} aria-label="Attiva ${esc(w.h)}"><div class="h">${esc(w.h)}</div><div><b>${esc(w.p)}</b> <span>${esc(w.m)}</span><br>${st}</div><button class="btn sm" data-edit="${k}">Modifica</button></div>`;
}

function form(w,k){
  const f=(n,l,x)=>`<label>${l}<input data-f="${n}" value="${esc(w[n])}" ${x||""}></label>`;
  return `<form class="edit" onsubmit="return false">${f("h","Carattere")}${f("p","Pinyin")}${f("m","Significato")}${f("c","Componenti")}${f("t","Tratti",'inputmode="numeric"')}${f("k","Trucco")}
  <div class="row"><button type="button" class="btn pri" data-act="saveedit" data-k="${k}">Salva</button><button type="button" class="btn" data-act="cancel">Annulla</button>${k==="new"?"":`<button type="button" class="btn no" data-act="del" data-k="${k}">Elimina</button>`}</div></form>`;
}

function cnt(){const c=$("#cnt");if(c)c.textContent=act().length+" su "+DB.words.length+" attive"}

function visible(){
  const q=qv.trim().toLowerCase();
  return DB.words.map((w,k)=>({w,k})).filter(({w})=>(!q||(w.h+w.p+w.m).toLowerCase().includes(q))&&(flt==="all"||(flt==="on")===!!w.on));
}

function drawList(){
  let html=editing==="new"?form({h:"",p:"",m:"",c:"",t:"",k:""},"new"):"";
  html+=visible().map(({w,k})=>editing===k?form(w,k):row(w,k)).join("");
  $("#rows").innerHTML=html||`<p class="empty">Nessun risultato.</p>`;
  cnt();
}

function list(){
  app.innerHTML=`<div class="srch"><input type="search" id="q" placeholder="Cerca carattere, pinyin o significato"><select id="flt" aria-label="Filtro"><option value="all">Tutte</option><option value="on">Accese</option><option value="off">Spente</option></select></div>
  <p class="hint tight">Accendi solo le parole che hai già imparato: Impara, Ripasso e Playground useranno solo quelle. "Tutte on" e "Tutte off" agiscono sulle parole mostrate dalla ricerca e dal filtro.</p>
  <div class="tools top"><span id="cnt"></span><button class="btn sm" data-act="allon">Tutte on</button><button class="btn sm" data-act="alloff">Tutte off</button><button class="btn sm pri" data-act="add">Aggiungi</button></div>
  <div id="rows"></div>
  <div class="tools"><button class="btn" data-act="export">Salva progressi</button><label class="btn">Carica<input type="file" id="imp" accept=".json" hidden></label></div>`;
  $("#q").value=qv;$("#q").oninput=e=>{qv=e.target.value;drawList()};
  $("#flt").value=flt;$("#flt").onchange=e=>{flt=e.target.value;drawList()};
  drawList();
  $("#imp").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(d && Array.isArray(d.words)){
          DB={words:d.words,prog:(d.prog&&typeof d.prog==="object")?d.prog:{},v:Math.max(4,d.v||4)};
        }else if(d && typeof d==="object"){
          DB.prog=d;
        }else{
          throw new Error("formato");
        }
        // migra al volo i campi SR
        Object.keys(DB.prog).forEach(h=>g(h));
        DB.v=Math.max(4,DB.v||4);
        save();render();
      }catch(x){alert("File non valido: serve un JSON salvato da questo sito.")}
    };r.readAsText(f)};
}

function exportData(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}));
  a.download="progressi-cinese.json";a.click();
}

function saveEdit(btn){
  const f=btn.closest("form"),v={};
  f.querySelectorAll("[data-f]").forEach(x=>v[x.dataset.f]=x.value.trim());
  if(!v.h||!v.m){alert("Servono almeno il carattere e il significato.");return}
  const idx=btn.dataset.k==="new"?-1:Number(btn.dataset.k);
  if(DB.words.some((w,n)=>w.h===v.h&&n!==idx)){alert("Questo carattere è già nell'elenco.");return}
  const nw={h:v.h,p:v.p,m:v.m,c:v.c,t:Number(v.t)||v.t,k:v.k};
  if(idx<0)DB.words.push({...nw,on:true});
  else{
    const old=DB.words[idx];
    if(old.h!==v.h&&DB.prog[old.h]){DB.prog[v.h]=DB.prog[old.h];delete DB.prog[old.h]}
    DB.words[idx]={...nw,on:old.on};
  }
  save();editing=null;render();
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-m],[data-act],[data-edit],[data-grade]");if(!t)return;
  if(t.dataset.tab)return go(t.dataset.tab);
  if(t.dataset.m)return go("play",t.dataset.m);
  if(t.dataset.grade!==undefined)return answer(SR[t.dataset.grade]);
  if(t.dataset.edit!==undefined){editing=Number(t.dataset.edit);return drawList()}
  const a=t.dataset.act;
  if(a==="show"){shown=true;render()}
  else if(a==="ok")answer(SR.good)
  else if(a==="ko")answer(SR.again)
  else if(a==="say"&&Q[i])say(Q[i].h)
  else if(a==="again")go(tab,mode)
  else if(a==="export")exportData()
  else if(a==="add"){editing="new";drawList();window.scrollTo(0,0)}
  else if(a==="cancel"){editing=null;drawList()}
  else if(a==="saveedit")saveEdit(t)
  else if(a==="del"){const k=Number(t.dataset.k);if(confirm("Eliminare "+DB.words[k].h+" dall'elenco?")){delete DB.prog[DB.words[k].h];DB.words.splice(k,1);save();editing=null;render()}}
  else if(a==="allon"||a==="alloff"){visible().forEach(({w})=>w.on=a==="allon");save();stat();drawList()}
});
document.addEventListener("change",e=>{
  const c=e.target.closest("[data-tog]");if(!c)return;
  DB.words[Number(c.dataset.tog)].on=c.checked;save();
  c.closest(".item").classList.toggle("off",!c.checked);cnt();stat();
});
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||!Q[i]||tab==="list")return;
  if(e.key===" "&&!shown){e.preventDefault();shown=true;render()}
  else if(shown&&e.key==="1")answer(SR.again)
  else if(shown&&e.key==="2")answer(SR.hard)
  else if(shown&&e.key==="3")answer(SR.good)
  else if(shown&&e.key==="4")answer(SR.easy)
  else if(e.key.toLowerCase()==="a")say(Q[i].h);
});

/* migrazione esplicita allo schema SR (v4) */
if((DB.v||3)<4){
  Object.keys(DB.prog).forEach(h=>g(h));
  DB.v=4;save();
}

go("learn");
</script>
</body>
</html>
